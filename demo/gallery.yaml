# Only non-wait steps capture a frame, and `wait` merely holds the last one. Each scene
# therefore repeats its caption step, one frame per repeat, so the spinners keep moving.
name: gallery
caption:
  lang: en
  position: { page: bottom }
screens:
  - id: page
    url: http://127.0.0.1:5173/
    size: [1100, 760]
timing:
  # A caption step takes about 52 ms to capture; the 48 ms wait after it makes each
  # frame cover the same 100 ms on screen as it did in the browser.
  frameMs: 52
steps:
